    CoverageCreate:
      type: object
      additionalProperties: false
      description: "A coverage to record for a patient. It is saved straight away, but as `unconfirmed` with `coverage_active: false`; clinic staff confirm the payer match before it counts. `payer_id` must be a payer the clinic has enabled in Settings → Insurance (see `GET …/payers`), otherwise `payer_not_enabled`; a patient can hold one coverage per payer (`coverage_exists`). `coverage_active: true` is refused with `activation_requires_staff`. The clinic's notes, the deductible and out-of-pocket amounts met and every eligibility field cannot be sent. The `Idempotency-Key` header is REQUIRED. Send JSON; a FHIR Coverage body is not accepted."
      required:
