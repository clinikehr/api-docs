      properties:
        system:
          type: string
          enum:
            - snomed-ct
            - local
        code:
          type: string
    ReferralReasonCode:
      type: object
      description: A coded reason. `system` is `icd-10-cm` or `icd-10` (checked against the platform's own diagnosis codes and stored in canonical form; an unrecognised code is refused), `snomed-ct` (6 to 18 digits, shape only) or `local` (your own code, never mapped to a standard).
      required:
        - system
        - code
      properties:
        system:
          type: string
          enum:
            - icd-10-cm
            - icd-10
            - snomed-ct
            - local
        code:
          type: string
    ReferralService:
      type: object
