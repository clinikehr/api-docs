    AppointmentCreateRequest:
      type: object
      required:
        - patient_id
        - service_id
        - start_at
      properties:
        patient_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        start_at:
          type: string
          format: date-time
          description: ISO 8601 WITH an explicit offset — a value with no offset is invalid_request, never a silent UTC/local guess.
        clinician_id:
          type: string
          format: uuid
          description: Omit to let the pool pick a free, eligible clinician.
        location_id:
          type: string
          format: uuid
        venue_type:
          type: string
          enum:
            - physical
            - online
            - mobile_clinic
          default: physical
        urgency_level:
          type: string
          enum:
            - low
            - normal
            - high
            - emergency
          default: normal
        patient_notes:
          type: string
        clinic_notes:
          type: string
        symptoms_description:
          type: string
        status:
          type: string
          enum:
            - scheduled
            - confirmed
          default: scheduled
        payment_amount:
          type: number
        payment_method:
          type: string
        payment_status:
          type: string
          enum:
            - pending
            - paid
          default: pending
        notify_patient:
          type: boolean
          default: true
          description: false sets email_notifications/sms_notifications/voice_notifications false on the row itself — a real, persistent setting, not a one-time suppression.
        run_automations:
          type: boolean
          default: false
          description: Default false suppresses the appointment.created/*.status Agent Studio dispatch.
