openapi: 3.1.0
info:
  title: ClinikEHR API
  version: 1.0.0
  description: |-
    Server-to-server REST API for a clinic's own data, reached with a key the clinic (or a developer workspace) creates in the developer portal.

    Authenticate every request with `Authorization: Bearer <key>`. Test keys reach only your workspace's own synthetic sandbox; live keys reach the clinic that created them. Lists wrap their rows as `{ data, has_more, next_cursor }`; single resources are returned directly. Errors are `application/problem+json` (RFC 9457) with a stable `code`.

    Write requests accept an `Idempotency-Key` header so a retry never repeats a change. See the guides for authentication, permissions, pagination, rate limits and retries.
servers:
  - url: https://api.clinikehr.com/v1
security:
  - ApiKey: []
components:
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      bearerFormat: ehr_live_<keyId>_<secret> or ehr_test_<keyId>_<secret>
  schemas:
    Problem:
      type: object
      description: RFC 9457 application/problem+json.
      required:
        - type
        - title
        - status
        - code
        - request_id
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            required:
              - pointer
              - message
            properties:
              pointer:
                type: string
              message:
                type: string
    Identifier:
      type: object
      required:
        - system
        - value
      properties:
        system:
          type: string
          enum:
            - gtin
            - nafdac
            - ndc
            - rxcui
            - partner
        value:
          type: string
    Money:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          description: Decimal string.
        currency:
          type: string
          description: ISO 4217 code, from clinic_settings.currency.
    Me:
      type: object
      required:
        - key_id
        - clinic_id
        - environment
        - scopes
        - org_id
        - sandbox
      properties:
        key_id:
          type: string
        clinic_id:
          type:
            - string
            - "null"
          format: uuid
        environment:
          type: string
          enum:
            - live
            - test
        scopes:
          type: array
          items:
            type: string
        org_id:
          type:
            - string
            - "null"
          format: uuid
        sandbox:
          type: boolean
          description: True when clinic_id above is this key's workspace's synthetic sandbox clinic, not a real one. Always false for a clinic-owned key.
    ConnectionSummary:
      type: object
      required:
        - clinic_id
        - clinic_name
        - environment
        - granted_scopes
        - connected_at
        - expires_at
        - sandbox
      properties:
        clinic_id:
          type: string
          format: uuid
        clinic_name:
          type:
            - string
            - "null"
          description: The clinic's display name — null for the synthetic sandbox (there is no real clinic behind it).
        environment:
          type: string
          enum:
            - live
            - test
        granted_scopes:
          type: array
          items:
            type: string
        connected_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the connection was approved. Null for a clinic-owned key's implicit self-connection and for the sandbox entry — neither is a consent-model connection row.
        expires_at:
          type:
            - string
            - "null"
          format: date-time
          description: When a PHI-scoped connection must be re-attested. Null for a non-PHI-only connection, a clinic-owned key, and the sandbox entry.
        sandbox:
          type: boolean
          description: True when this entry IS the workspace's synthetic sandbox, not a real clinic.
    InventoryLocation:
      type: object
      required:
        - id
        - name
        - is_active
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type:
            - string
            - "null"
        is_active:
          type: boolean
        updated_at:
          type:
            - string
            - "null"
          format: date-time
    InventoryItem:
      type: object
      required:
        - id
        - name
        - is_active
        - identifiers
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        generic_name:
          type:
            - string
            - "null"
        brand_name:
          type:
            - string
            - "null"
        strength:
          type:
            - string
            - "null"
        dosage_form:
          type:
            - string
            - "null"
        category:
          type:
            - string
            - "null"
        item_type:
          type:
            - string
            - "null"
        unit_of_measure:
          type:
            - string
            - "null"
        is_active:
          type: boolean
        identifiers:
          type: array
          items:
            $ref: "#/components/schemas/Identifier"
        retail_price:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        updated_at:
          type:
            - string
            - "null"
          format: date-time
    InventoryAvailability:
      type: object
      required:
        - matched
      properties:
        item_id:
          type:
            - string
            - "null"
          format: uuid
        matched:
          type: boolean
        band:
          type:
            - string
            - "null"
          enum:
            - out
            - low
            - in_stock
            - null
        as_of:
          type:
            - string
            - "null"
          format: date-time
    AvailabilityRequestEntry:
      description: Exactly one of an item_id, or a {system, value} identifier — never both.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - item_id
          properties:
            item_id:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          required:
            - system
            - value
          properties:
            system:
              type: string
              enum:
                - gtin
                - nafdac
                - ndc
                - rxcui
                - partner
            value:
              type: string
    AvailabilityRequest:
      type: object
      additionalProperties: false
      required:
        - entries
      properties:
        entries:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/AvailabilityRequestEntry"
    InventoryStock:
      type: object
      required:
        - item_id
        - quantity
      properties:
        item_id:
          type: string
          format: uuid
        location_id:
          type:
            - string
            - "null"
          format: uuid
        lot_id:
          type:
            - string
            - "null"
        quantity:
          type: string
          description: Decimal string.
        reserved_quantity:
          type: string
          description: Decimal string. Units already committed elsewhere — never counted as sellable.
        expiry_date:
          type:
            - string
            - "null"
          format: date
          description: The lot's expiry date. Null for stock held without a lot, or a lot with none recorded.
        lot_status:
          type:
            - string
            - "null"
          description: The lot's own status (e.g. active, quarantined, recalled). Null when there is no lot.
        as_of:
          type:
            - string
            - "null"
          format: date-time
    ListingBand:
      type:
        - string
        - "null"
      enum:
        - out
        - low
        - in_stock
        - unknown
        - null
      description: Unlike inventory availability's band, listing carries a fourth value, `unknown` — the till heartbeat is missing or stale during open hours. Never coerced to another value; a listing route never returns an exact quantity.
    ListingPin:
      type: object
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
        lng:
          type: number
    ListingPharmacy:
      type: object
      required:
        - clinic_id
      properties:
        clinic_id:
          type: string
          format: uuid
        display_name:
          type:
            - string
            - "null"
        address_line1:
          type:
            - string
            - "null"
        address_line2:
          type:
            - string
            - "null"
        city:
          type:
            - string
            - "null"
        region:
          type:
            - string
            - "null"
        country:
          type:
            - string
            - "null"
        postal_code:
          type:
            - string
            - "null"
        pin:
          oneOf:
            - $ref: "#/components/schemas/ListingPin"
            - type: "null"
          description: Owner-placed on the "Get listed" sheet's map. Null = this pharmacy cannot be ranked by distance in network search.
        phone:
          type:
            - string
            - "null"
        hours:
          type:
            - object
            - "null"
        open_now:
          type:
            - boolean
            - "null"
          description: Computed from the clinic's own business hours. Null when hours are absent or malformed for today — never a guess.
    ListingProfile:
      type: object
      required:
        - clinic_id
      properties:
        clinic_id:
          type: string
          format: uuid
        display_name:
          type:
            - string
            - "null"
        address_line1:
          type:
            - string
            - "null"
        address_line2:
          type:
            - string
            - "null"
        city:
          type:
            - string
            - "null"
        region:
          type:
            - string
            - "null"
        country:
          type:
            - string
            - "null"
        postal_code:
          type:
            - string
            - "null"
        pin:
          oneOf:
            - $ref: "#/components/schemas/ListingPin"
            - type: "null"
        phone:
          type:
            - string
            - "null"
        hours:
          type:
            - object
            - "null"
        price_opt_in:
          type: boolean
          description: Separate opt-in for listing.prices:read. Off by default.
        profile_completed_at:
          type:
            - string
            - "null"
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time
    ListingSearchResult:
      type: object
      required:
        - band
      properties:
        clinic_id:
          type:
            - string
            - "null"
          format: uuid
        display_name:
          type:
            - string
            - "null"
        item_id:
          type:
            - string
            - "null"
          format: uuid
        match:
          type:
            - string
            - "null"
          enum:
            - code
            - text
            - null
          description: Equivalence confidence label, never a license to surface an unlinked or excluded item.
        band:
          $ref: "#/components/schemas/ListingBand"
        distance_km:
          type:
            - number
            - "null"
          description: Null when the pharmacy has no owner-placed pin, or no `near` was given — ranked last, never excluded.
        as_of:
          type:
            - string
            - "null"
          format: date-time
    ListingClinicItem:
      type: object
      required:
        - band
      properties:
        item_id:
          type:
            - string
            - "null"
          format: uuid
        name:
          type:
            - string
            - "null"
        band:
          $ref: "#/components/schemas/ListingBand"
        as_of:
          type:
            - string
            - "null"
          format: date-time
    ListingSearchRequestItem:
      description: Exactly one of an identifier {system, value} or a free-text {q}.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - system
            - value
          properties:
            system:
              type: string
              enum:
                - gtin
                - nafdac
                - ndc
                - rxcui
                - partner
            value:
              type: string
        - type: object
          additionalProperties: false
          required:
            - q
          properties:
            q:
              type: string
              description: Free-text name match. Labelled as a text match, never as equivalence.
    ListingSearchRequest:
      type: object
      additionalProperties: false
      required:
        - item
      properties:
        item:
          $ref: "#/components/schemas/ListingSearchRequestItem"
        near:
          type: object
          additionalProperties: false
          properties:
            lat:
              type: number
            lng:
              type: number
            radius_km:
              type: number
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 25
    ListingFeedbackRequest:
      type: object
      additionalProperties: false
      required:
        - item
        - outcome
      description: No user data, ever.
      properties:
        item:
          $ref: "#/components/schemas/ListingSearchRequestItem"
        clinic_id:
          type:
            - string
            - "null"
          format: uuid
        outcome:
          type: string
          enum:
            - confirmed_available
            - confirmed_unavailable
            - wrong_match
            - stale
    NextOfKin:
      type: object
      properties:
        name:
          type:
            - string
            - "null"
        phone:
          type:
            - string
            - "null"
        address:
          type:
            - string
            - "null"
    Employment:
      type: object
      properties:
        status:
          type:
            - string
            - "null"
        company:
          type:
            - string
            - "null"
        role:
          type:
            - string
            - "null"
    PatientBilling:
      type: object
      properties:
        individual_type:
          type:
            - string
            - "null"
          enum:
            - self_pay
            - insurance
            - null
        group_type:
          type:
            - string
            - "null"
          enum:
            - self_pay
            - insurance
            - null
    PatientEmail:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        type:
          type:
            - string
            - "null"
        permission:
          type:
            - string
            - "null"
          enum:
            - email_ok
            - no_email
            - null
        is_primary:
          type: boolean
          default: false
    PatientPhone:
      type: object
      required:
        - phone_number
      properties:
        phone_number:
          type: string
        type:
          type:
            - string
            - "null"
        permission:
          type:
            - string
            - "null"
          enum:
            - text_voicemail_ok
            - text_ok
            - voicemail_ok
            - no_call
            - null
        is_primary:
          type: boolean
          default: false
    PatientGuardian:
      type: object
      properties:
        guardian_id:
          type:
            - string
            - "null"
          format: uuid
        first_name:
          type:
            - string
            - "null"
        last_name:
          type:
            - string
            - "null"
        email:
          type:
            - string
            - "null"
        phone:
          type:
            - string
            - "null"
        relationship:
          type:
            - string
            - "null"
          enum:
            - parent
            - grandparent
            - sibling
            - aunt_uncle
            - legal_guardian
            - foster_parent
            - step_parent
            - other
            - null
        is_responsible_for_billing:
          type: boolean
          default: false
        is_primary:
          type: boolean
          default: false
        can_access_records:
          type: boolean
          default: false
        is_emergency_contact:
          type: boolean
          default: true
        can_schedule_appointments:
          type: boolean
          default: false
        notes:
          type:
            - string
            - "null"
    PatientNotificationSettings:
      type: object
      description: Read-only — refused (notification_settings_not_writable) if sent on a write.
      properties:
        upcoming_appointments_enabled:
          type:
            - boolean
            - "null"
        upcoming_appointments_email_option:
          type:
            - string
            - "null"
        upcoming_appointments_phone_option:
          type:
            - string
            - "null"
        incomplete_documents_enabled:
          type:
            - boolean
            - "null"
        incomplete_documents_email_option:
          type:
            - string
            - "null"
        incomplete_documents_phone_option:
          type:
            - string
            - "null"
        cancellations_enabled:
          type:
            - boolean
            - "null"
        cancellations_email_option:
          type:
            - string
            - "null"
        cancellations_phone_option:
          type:
            - string
            - "null"
    PatientCouple:
      type: object
      description: Read-only — a couple registration is a separate two-patient transaction this API does not perform.
      properties:
        partner_id:
          type:
            - string
            - "null"
          format: uuid
        responsible_for_billing:
          type:
            - boolean
            - "null"
        relationship_status:
          type:
            - string
            - "null"
    Patient:
      type: object
      required:
        - id
        - first_name
        - last_name
      properties:
        id:
          type: string
          format: uuid
        mrn:
          type:
            - string
            - "null"
        first_name:
          type: string
        last_name:
          type: string
        middle_name:
          type:
            - string
            - "null"
        preferred_name:
          type:
            - string
            - "null"
        title:
          type:
            - string
            - "null"
        suffix:
          type:
            - string
            - "null"
        date_of_birth:
          type:
            - string
            - "null"
          format: date
        gender:
          type:
            - string
            - "null"
          enum:
            - male
            - female
            - other
            - null
        marital_status:
          type:
            - string
            - "null"
          enum:
            - single
            - married
            - divorced
            - widowed
            - separated
            - null
        client_type:
          type:
            - string
            - "null"
          enum:
            - adult
            - minor
            - couple
            - null
        client_status:
          type:
            - string
            - "null"
          description: Read-only global status (patients.client_status).
        is_dependent:
          type: boolean
        email:
          type:
            - string
            - "null"
        phone:
          type:
            - string
            - "null"
        secondary_phone:
          type:
            - string
            - "null"
        country:
          type:
            - string
            - "null"
        nationality:
          type:
            - string
            - "null"
        occupation:
          type:
            - string
            - "null"
        residential_address:
          type:
            - string
            - "null"
        work_address:
          type:
            - string
            - "null"
        city:
          type:
            - string
            - "null"
        state:
          type:
            - string
            - "null"
        zip:
          type:
            - string
            - "null"
        next_of_kin:
          $ref: "#/components/schemas/NextOfKin"
        national_id:
          type:
            - string
            - "null"
        preferred_language:
          type:
            - string
            - "null"
        referred_by:
          type:
            - string
            - "null"
        referral_source_id:
          type:
            - string
            - "null"
          format: uuid
        employment:
          $ref: "#/components/schemas/Employment"
        is_waitlist:
          type: boolean
        billing:
          $ref: "#/components/schemas/PatientBilling"
        sponsor_id:
          type:
            - string
            - "null"
          format: uuid
        allergies:
          type: array
          items:
            type: string
        medical_history:
          type:
            - string
            - "null"
        current_medications:
          type: array
          items:
            type: string
        chronic_conditions:
          type: array
          items:
            type: string
        blood_type:
          type:
            - string
            - "null"
          enum:
            - O+
            - O-
            - A+
            - A-
            - B+
            - B-
            - AB+
            - AB-
            - null
        genotype:
          type:
            - string
            - "null"
          enum:
            - AA
            - AS
            - SS
            - AC
            - SC
            - null
        family_history:
          type:
            - string
            - "null"
        smoking_status:
          type:
            - string
            - "null"
        alcohol_use:
          type:
            - string
            - "null"
        recreational_drug_use:
          type:
            - string
            - "null"
        physical_activity:
          type:
            - string
            - "null"
        living_arrangement:
          type:
            - string
            - "null"
        has_profile_image:
          type: boolean
          description: Read-only. Whether the patient has a profile picture on file. The picture itself is not available through the API yet.
        profile_image_path:
          type:
            - string
            - "null"
          description: Read-only. Not available through the API yet - this value cannot be used to download the picture.
        status:
          type:
            - string
            - "null"
          enum:
            - active
            - prospect
            - inactive
            - blocked
            - null
        is_vip:
          type: boolean
        primary_location_id:
          type:
            - string
            - "null"
          format: uuid
        portal_access_enabled:
          type:
            - boolean
            - "null"
          description: Read-only.
        admission_status:
          type:
            - string
            - "null"
          description: Read-only, ward-only.
        couple:
          oneOf:
            - $ref: "#/components/schemas/PatientCouple"
            - type: "null"
        emails:
          type: array
          items:
            $ref: "#/components/schemas/PatientEmail"
          description: Write REPLACES the whole set.
        phones:
          type: array
          items:
            $ref: "#/components/schemas/PatientPhone"
          description: Write REPLACES the whole set.
        guardians:
          type: array
          items:
            $ref: "#/components/schemas/PatientGuardian"
          description: Write REPLACES the whole set. Only accepted when client_type=minor.
        insurance:
          type: array
          items:
            type: object
          description: Read-only. Own module, own save action — never written here.
        pharmacies:
          type: array
          items:
            type: object
          description: Read-only. Populated by intake extraction only.
        care_providers:
          type: array
          items:
            type: object
          description: Read-only. Populated by intake extraction only.
        notification_settings:
          oneOf:
            - $ref: "#/components/schemas/PatientNotificationSettings"
            - type: "null"
        created_at:
          type:
            - string
            - "null"
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time
    PatientDuplicateFlag:
      type: object
      required:
        - id
        - clinic_patient_id
        - candidate_clinic_patient_id
        - status
      properties:
        id:
          type: string
          format: uuid
        clinic_patient_id:
          type: string
          format: uuid
        candidate_clinic_patient_id:
          type: string
          format: uuid
        similarity:
          type:
            - number
            - "null"
        source:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - open
            - dismissed
            - merged
        decided_by_staff_id:
          type:
            - string
            - "null"
          format: uuid
        decided_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type:
            - string
            - "null"
          format: date-time
    PatientImportRequest:
      type: object
      additionalProperties: false
      required:
        - format
        - data
      properties:
        format:
          type: string
          enum:
            - json_array
            - ndjson
            - fhir_bundle
          description: How `data` is written.
        data:
          description: "`json_array` — an array of patient objects in the same shape as `createPatient` (a row that carries `allergies`, `current_medications` or `chronic_conditions` is rejected by name like any other invalid row). `ndjson` — one string, a patient object per line. `fhir_bundle` — a FHIR Bundle whose entries include Patient resources (other resource types are ignored). At most 100 rows."
          oneOf:
            - type: array
