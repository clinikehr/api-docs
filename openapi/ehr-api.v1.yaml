            - self
            - spouse
            - child
            - other
            - employee
            - organ_donor
            - cadaver_donor
            - life_partner
        subscriber_first_name:
          type: string
          maxLength: 200
        subscriber_last_name:
          type: string
          maxLength: 200
        subscriber_date_of_birth:
          type: string
          format: date
        subscriber_gender:
          type: string
          enum:
            - M
            - F
            - U
        subscriber_member_id:
          type: string
          maxLength: 200
        subscriber_address_line1:
          type: string
          maxLength: 200
        subscriber_address_city:
          type: string
          maxLength: 200
        subscriber_address_state:
          type: string
          maxLength: 200
        subscriber_address_zip:
          type: string
          maxLength: 200
        coverage_active:
          type: boolean
          description: "Only `false` is accepted: it ends the coverage. `true` is refused."
        effective_date:
          type: string
          format: date
        termination_date:
          type: string
          format: date
        copay_amount:
          type: number
          minimum: 0
        coinsurance_percent:
          type: number
          minimum: 0
          maximum: 100
        deductible_amount:
          type: number
          minimum: 0
        out_of_pocket_max:
          type: number
          minimum: 0
        pre_authorization_required:
          type: boolean
        network_status:
          type: string
          enum:
            - in_network
            - out_of_network
            - unknown
        is_primary:
          type: boolean
  responses:
    Unauthorized:
      description: Missing, malformed, unknown, revoked or expired key, or the wrong secret.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The key or connection lacks the required scope, the plan does not include this resource, the request came from an address this key's IP allow-list does not permit, a TEST-environment workspace key asked for a clinic_id other than its own workspace's sandbox (`sandbox_only`), or a LIVE workspace key asked for a real clinic while its workspace's verification has lapsed (`not_verified`) — the response never names which addresses ARE allowed, nor which clinic actually is the sandbox.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The record is absent, or out of the key's scope — one message for both.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limited. See the Retry-After header.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: The request failed validation (unknown query parameter, limit out of range, malformed body).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: "The request is well-formed but conflicts with the CURRENT STATE of the record — a double-booked slot (`slot_taken`), a clinician's calendar blocked at that time (`out_of_office`), nobody eligible free (`no_provider_available`), an item that still has stock (`item_has_stock`), a ledger movement that cannot be covered (`insufficient_stock`, `expired_stock_not_transferable`), a note already signed or clinician-touched (`note_not_editable`), an Idempotency-Key already used for a different request or still in flight (`idempotency_key_conflict`, `idempotency_key_reused`), or an external-stock batch rejected as structurally invalid or a suspicious shrink versus the clinic's last accepted batch (`batch_rejected`), or an outside record that conflicts with what was already submitted or decided: the same `client_reference` sent again with different content (`client_reference_conflict`), or a submission a clinician has already decided (`submission_not_pending`), or an insurance write that conflicts with the clinic's setup or the coverage's state: the patient already has a coverage for that payer (`coverage_exists`, the existing coverage's id is in `detail` when the caller can see that patient), a payer the clinic has not enabled in Settings → Insurance (`payer_not_enabled`), or `coverage_active: true` sent through the API (`activation_requires_staff` — only clinic staff activate a coverage), or a change to an outside care provider the clinic added rather than an app (`care_provider_clinic_managed` — only the clinic can change or remove it)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: The request body is larger than the route accepts (`payload_too_large` — 10 MiB for a patient import).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Gone:
      description: The thing asked about existed and is no longer held (`file_expired` — an import's uploaded file is deleted after 7 days).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
paths:
  /v1/metadata:
    get:
      operationId: getCapabilityStatement
      tags:
        - Fhir
      summary: FHIR R4 CapabilityStatement — exactly what this gateway supports, nothing more.
      description: No bearer key required (this is the same discovery document for every caller); Content-Type is application/fhir+json, not the {data} envelope. Lists ONLY the resources/interactions this gateway actually serves — Patient, Appointment, DocumentReference (notes), Condition, AllergyIntolerance, MedicationStatement, MedicationRequest, Practitioner (providers), Coverage, Organization (insurance payers) and MedicationKnowledge (inventory items), search parameters limited to the query filters the plain JSON routes already accept. There is no _include/_revinclude and no general /fhir passthrough — see the developer guide (api-docs/fhir.mdx) for what a partner will not find.
      responses:
        "200":
          description: OK.
          content:
            application/fhir+json:
              schema:
                type: object
  /v1/me:
    get:
      operationId: getMe
      tags:
        - Me
      summary: The calling key's identity, environment and scopes.
      description: Response is the resource DIRECTLY — no `data` wrapper (see the top-level description's "Response envelope" note).
      security:
        - ApiKey: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
              example:
                key_id: key_01H...
                clinic_id: 45715198-88e4-498c-8271-57e652c60246
                environment: live
                scopes:
                  - inventory.items:read
                  - inventory.availability:read
                org_id: null
                sandbox: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/connections:
    get:
      operationId: listConnections
      tags:
        - Connections
      summary: Clinics this key can reach, and the scopes granted to it.
      description: "For a workspace TEST key this is always one entry — the workspace's own sandbox, marked sandbox: true. For a LIVE workspace key this lists every clinic with an ACTIVE, non-expired connection that also still has API access switched on — the same set the key could actually reach on the next call, never a stale or pending one. An unverified workspace, or one with no connections yet, gets an empty list. A clinic-owned key gets exactly one entry, for its own clinic."
      security:
        - ApiKey: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - has_more
                  - next_cursor
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConnectionSummary"
                  has_more:
                    type: boolean
                  next_cursor:
                    type:
                      - string
                      - "null"
              example:
                data:
                  - clinic_id: 45715198-88e4-498c-8271-57e652c60246
                    clinic_name: City Medical Center
                    environment: live
                    granted_scopes:
                      - inventory.items:read
                    connected_at: 2026-09-28T10:00:00Z
                    expires_at: null
                    sandbox: false
                has_more: false
                next_cursor: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/clinics/{clinic_id}/inventory/locations:
    get:
      operationId: listInventoryLocations
      tags:
        - Inventory
      summary: Stock locations inside the clinic (storerooms, shelves, fridges).
      description: For a workspace TEST key this reads the workspace's seeded synthetic sandbox, never a real clinic's locations — same shape either way.
      security:
        - ApiKey: []
      parameters:
        - name: clinic_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: starting_after
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - has_more
                  - next_cursor
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/InventoryLocation"
                  has_more:
                    type: boolean
                  next_cursor:
                    type:
                      - string
                      - "null"
              example:
                data:
                  - id: 6a9f7e3e-2b5a-4a86-8f0d-4a6a2b3c9a11
                    name: Main storeroom
                    type: room
                    is_active: true
                    updated_at: 2026-09-20T10:00:00Z
                has_more: false
                next_cursor: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/clinics/{clinic_id}/inventory/items:
    get:
      operationId: listInventoryItems
      tags:
        - Inventory
      summary: The clinic's catalogue.
      description: For a workspace TEST key this reads the workspace's seeded synthetic sandbox catalogue, never a real clinic's — same shape either way.
      security:
        - ApiKey: []
      parameters:
        - name: clinic_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: Free-text name match. Labelled as a text match, never as equivalence.
          schema:
            type: string
        - name: barcode
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: updated_since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: starting_after
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - has_more
                  - next_cursor
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/InventoryItem"
                  has_more:
                    type: boolean
                  next_cursor:
                    type:
                      - string
                      - "null"
              example:
                data:
                  - id: 9c1e6f2a-9b2b-4a36-8f6a-2f7b1e8b9a02
                    name: Paracetamol 500mg Tablets
                    generic_name: paracetamol
                    brand_name: Panadol
                    strength: 500mg
                    dosage_form: tablet
                    category: analgesic
                    item_type: medication
                    unit_of_measure: tablet
                    is_active: true
                    identifiers:
                      - system: gtin
                        value: "6001234567890"
                    retail_price:
                      amount: "12.50"
                      currency: NGN
                    updated_at: 2026-09-20T10:00:00Z
                has_more: false
                next_cursor: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createInventoryItem
      tags:
        - Inventory
      summary: Add a catalogue item.
      description: Unknown fields refused by name. container_sale_price/container_cost are refused outright.
      security:
        - ApiKey: []
      parameters:
        - name: clinic_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemCreateRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/InventoryItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/clinics/{clinic_id}/inventory/items/{item_id}:
