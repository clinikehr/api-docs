  /v1/clinics/{clinic_id}/coverages:
    get:
      operationId: listCoverages
      tags:
        - Coverages
      summary: List one patient's insurance coverages.
      description: "`patient_id` is required. `verification_status` filters to coverages staff have `confirmed`, ones still `unconfirmed` (added through the API and waiting for staff), or `all` (default). A restricted patient's coverages are never returned. With `Accept: application/fhir+json` the answer is a searchset Bundle of FHIR R4 Coverage resources; an unconfirmed coverage reads as status `draft`."
      security:
        - ApiKey: []
      parameters:
        - name: clinic_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: patient_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: verification_status
          in: query
          required: false
          schema:
            type: string
            enum:
              - all
              - confirmed
              - unconfirmed
            default: all
        - name: updated_since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: starting_after
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - has_more
                  - next_cursor
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Coverage"
                  has_more:
                    type: boolean
                  next_cursor:
                    type:
                      - string
                      - "null"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createCoverage
      tags:
        - Coverages
      summary: Record a patient's insurance coverage.
      description: "The coverage is saved and visible straight away, answers 201 Created with the coverage, and is `unconfirmed` with `coverage_active: false` until clinic staff confirm the payer match. The payer must be one the clinic has enabled (`payer_not_enabled` otherwise). A patient can hold one coverage per payer (`coverage_exists`). The `Idempotency-Key` header is REQUIRED — a retry with the same key returns the original coverage, never a second one. Send JSON; a FHIR Coverage body is refused."
      security:
        - ApiKey: []
      parameters:
        - name: clinic_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoverageCreate"
      responses:
        "201":
          description: Created — saved, unconfirmed and inactive until staff confirm it.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Coverage"
                  idempotent_replay:
                    type: boolean
                    description: Present and true when this Idempotency-Key was already used and the original coverage is returned.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
