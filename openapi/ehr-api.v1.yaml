    ReferralRequester:
      type: object
      description: Who sent the referral, as the sender states it. Nothing here is checked against a directory.
      properties:
        name:
          type:
            - string
            - "null"
        organization:
          type:
            - string
            - "null"
        npi:
          type:
            - string
            - "null"
          description: Ten digits.
    ReferralRecipient:
      type: object
      description: Who at the clinic will see the patient. Set by clinic staff when they accept the referral; never by a sender.
      properties:
        provider_id:
          type:
            - string
            - "null"
          format: uuid
          description: A provider `id` from `listProviders`.
        department_id:
          type:
            - string
            - "null"
          format: uuid
    Referral:
      type: object
      description: "A clinical referral: another provider or service asks this clinic to see a patient. It is NOT the clinic referral programme (clinic-to-clinic credits for recommending ClinikEHR), the marketing \"referred by\" source on a client, or an antenatal or postnatal referral note. The exposed-field allow-list, field by field. `review_status` says where the record stands: `confirmed` is on the clinic's referral list; `pending` is an outside submission still waiting for clinic staff; `rejected` and `withdrawn` are this key's own submissions that did not become a referral. For a confirmed referral `status` is the clinic's workflow: it lands `received`, and only the clinic accepts, declines, schedules, completes or cancels it. A sender can never change `status`, `recipient` or `scheduled_appointment_id`. `decision_reason` on a confirmed referral (the clinic's reason for declining or cancelling) is shown only to the key or organization that sent it; everyone else sees null."
      required:
        - id
        - patient_id
        - direction
        - status
        - service
        - reason
        - review_status
      properties:
        id:
          type:
            - string
            - "null"
          format: uuid
          description: The referral's id once confirmed; null for a pending create (use `submission_id`). A pending update or retraction carries the id of the referral it targets.
        patient_id:
          type: string
          format: uuid
        direction:
          type:
            - string
            - "null"
          enum:
            - incoming
            - outgoing
            - null
          description: "`incoming` is a referral to this clinic. Only `incoming` is written today."
        status:
          type:
            - string
            - "null"
          enum:
            - received
            - accepted
            - scheduled
            - completed
            - declined
            - cancelled
            - entered_in_error
            - null
          description: The clinic's workflow state. Null for a pending submission.
        priority:
          type:
            - string
            - "null"
          enum:
            - routine
            - urgent
            - asap
            - stat
            - null
        service:
          $ref: "#/components/schemas/ReferralService"
        reason:
          $ref: "#/components/schemas/ReferralReason"
        clinical_summary:
          type:
            - string
            - "null"
        requester:
          $ref: "#/components/schemas/ReferralRequester"
        recipient:
          $ref: "#/components/schemas/ReferralRecipient"
        requested_at:
          type:
            - string
            - "null"
          format: date-time
        needed_by:
          type:
            - string
            - "null"
          format: date
        scheduled_appointment_id:
          type:
            - string
            - "null"
          format: uuid
        source:
          type:
            - string
            - "null"
          enum:
            - clinic
            - api
            - null
        origin_assistant_name:
          type:
            - string
            - "null"
        accepted_by:
          type:
            - string
            - "null"
          enum:
            - clinic
            - automatic
            - null
          description: "Who put this record on the chart: `clinic` (the clinic's own team, or a clinician who confirmed it) or `automatic` (the clinic chose to accept this kind of item from this key or connection without review; the record is on the chart but no clinician has reviewed it, so `verification_status` reads `unconfirmed` until one does). Null while the item is still a pending submission."
        reviewed_at:
          type:
            - string
            - "null"
          format: date-time
          description: Set when a clinician marked an automatically accepted item reviewed; null otherwise.
        reviewed_by_staff_id:
          type:
            - string
            - "null"
          format: uuid
          description: clinic_staff.id of the clinician who marked an automatically accepted item reviewed; null otherwise.
        review_status:
          type: string
          enum:
            - confirmed
            - pending
            - rejected
            - withdrawn
        submission_id:
          type:
            - string
            - "null"
          format: uuid
        decision_reason:
          type:
            - string
            - "null"
          description: On a rejected submission, why clinic staff rejected it. On a confirmed referral, the clinic's reason for declining or cancelling - shown only to the key or organization that sent it.
        created_at:
          type:
            - string
            - "null"
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time
    ReferralCreate:
      type: object
      additionalProperties: false
      description: A referral to this clinic, submitted for clinic staff to confirm. It does not appear on the clinic's referral list until they do (unless the clinic has chosen to accept such submissions automatically); either way it lands as `received` and the clinic decides whether to accept, decline or schedule it. This is a clinical referral, not the clinic referral programme. Send `code` on `service` or `reason` only with its `system`. `client_reference` (your own id, up to 200 characters) makes a second submission of the same record with different content a `client_reference_conflict`.
      required:
        - patient_id
        - service
        - reason
      properties:
        patient_id:
          type: string
          format: uuid
        service:
          type: object
          additionalProperties: false
          required:
            - text
          properties:
            text:
              type: string
              minLength: 1
              maxLength: 300
            code:
              type: object
              additionalProperties: false
              required:
                - system
                - code
              properties:
                system:
                  type: string
                  enum:
                    - local
                    - snomed-ct
                code:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: A `snomed-ct` code is 6 to 18 digits.
        reason:
          type: object
          additionalProperties: false
          required:
            - text
          properties:
            text:
              type: string
              minLength: 1
              maxLength: 1000
            code:
              type: object
              additionalProperties: false
              required:
                - system
                - code
              properties:
                system:
                  type: string
                  enum:
                    - local
                    - icd-10-cm
                    - icd-10
                    - snomed-ct
                code:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: An `icd-10-cm` or `icd-10` code must be a recognised diagnosis code; a `snomed-ct` code is 6 to 18 digits.
        priority:
          type: string
          enum:
            - routine
            - urgent
            - asap
            - stat
          default: routine
        needed_by:
          type: string
          format: date
          description: Not earlier than yesterday.
        clinical_summary:
          type: string
          minLength: 1
          maxLength: 8000
        requester:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 200
            organization:
              type: string
              minLength: 1
              maxLength: 200
            npi:
              type: string
              pattern: ^[0-9]{10}$
        client_reference:
          type: string
          maxLength: 200
        origin_assistant_name:
          type: string
          maxLength: 200
    ReferralUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: "A proposed change to a referral, or a retraction. It becomes a NEW pending submission; the referral does not change until clinic staff confirm it. A change is always reviewed, even when the clinic accepts new referrals automatically. You can change a referral only while the clinic has not acted on it: once staff have accepted, declined, scheduled, completed or cancelled it, the change is refused. The service can never be changed (a different service is a new referral). `status` accepts only `entered_in_error`, which proposes retracting the referral as sent in error and cannot be combined with other changes. A sender cannot accept, decline, schedule, complete or cancel a referral."
      properties:
        status:
          type: string
          enum:
            - entered_in_error
        priority:
          type: string
          enum:
            - routine
            - urgent
            - asap
            - stat
        needed_by:
          type: string
          format: date
          description: Not earlier than yesterday.
        reason:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            text:
              type: string
              minLength: 1
              maxLength: 1000
            code:
              type: object
              additionalProperties: false
              required:
                - system
                - code
              properties:
                system:
                  type: string
                  enum:
                    - local
                    - icd-10-cm
                    - icd-10
                    - snomed-ct
                code:
                  type: string
                  minLength: 1
                  maxLength: 64
        clinical_summary:
          type: string
          minLength: 1
          maxLength: 8000
        requester:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 200
            organization:
              type: string
              minLength: 1
              maxLength: 200
            npi:
              type: string
              pattern: ^[0-9]{10}$
        client_reference:
          type: string
          maxLength: 200
        origin_assistant_name:
          type: string
          maxLength: 200
    Encounter:
      type: object
      description: "A visit as documented in the clinic: a clinical note seen as a visit — the exposed-field allow-list, field by field. The `id` is the note's id, so the same visit reads under Notes. It carries the visit's status, dates, administrative reason and clinician only: no note text, title, diagnosis, plan, service, signature or billing is ever exposed here (clinical text is read through Notes). Every encounter is a `consultation`; triage, ward and appointment records are not encounters in this API. A visit opened through the API is a `draft` with `review_status: pending` until a clinician has reviewed it."
      required:
        - id
        - patient_id
        - kind
        - status
        - period
        - source
        - review_status
      properties:
        id:
          type: string
          format: uuid
          description: The visit note's id.
        patient_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - consultation
        status:
          type: string
          enum:
            - draft
            - completed
          description: "`draft` until a clinician signs, locks or finalizes the note; `completed` after."
        class:
          type:
            - string
            - "null"
          enum:
            - ambulatory
            - emergency
            - inpatient
            - virtual
            - home_health
            - null
          description: Null when no class was recorded for the visit.
        period:
          type: object
          required:
            - start
            - end
          properties:
            start:
              type:
                - string
                - "null"
              format: date-time
            end:
              type:
                - string
                - "null"
              format: date-time
        reason:
          type:
            - string
            - "null"
          description: The administrative reason for the visit (at most 500 characters), not note text.
        clinician_id:
          type:
            - string
            - "null"
          format: uuid
          description: The clinician's id as listed by `GET …/providers` and `GET …/note-clinicians`.
        source:
          type: string
          enum:
            - clinic
            - api
          description: "`api` for a visit opened through the API."
        origin_assistant_name:
          type:
            - string
            - "null"
        review_status:
          type: string
          enum:
            - pending
            - confirmed
          description: "`confirmed` for a visit the clinic opened itself, and for an API draft once a clinician has reviewed it."
        created_at:
          type:
            - string
            - "null"
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time
    EncounterCreate:
      type: object
      additionalProperties: false
      description: "A visit to open for a patient. It opens a DRAFT note for a clinician to complete: nothing is ordered, prescribed, signed, locked or billed, and no note text can be sent (there is no field for it). The draft appears in the clinic's consultation list for the clinician to finish. `clinician_id` must be a clinician the clinic lists (see `GET …/note-clinicians`). The `Idempotency-Key` header is REQUIRED. Send JSON; a FHIR Encounter body is not accepted."
      required:
        - patient_id
        - clinician_id
      properties:
        patient_id:
          type: string
          format: uuid
        clinician_id:
          type: string
          format: uuid
        class:
          type: string
          enum:
            - ambulatory
            - emergency
            - inpatient
            - virtual
            - home_health
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          description: Must not be before `started_at`.
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: The administrative reason for the visit — not clinical note text.
        origin_assistant_name:
          type: string
          maxLength: 200
          description: Name of the assistant or connected app that opened the visit.
    EncounterUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: "A change to a visit's details. It is accepted only while the draft the same key opened is still untouched: once a clinician has edited or signed the note the answer is 409 `note_not_editable`, and another party's visit is a 404. Only these four fields can change; no note text can be sent and nothing is signed, locked or finalized. The `Idempotency-Key` header is optional. Send JSON; a FHIR Encounter body is not accepted."
      properties:
        class:
          type: string
          enum:
            - ambulatory
            - emergency
            - inpatient
            - virtual
            - home_health
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          description: Must not be before `started_at`.
        reason:
          type: string
          minLength: 1
          maxLength: 500
    Payer:
      type: object
      description: An insurance payer this clinic has enabled in Settings → Insurance. A coverage can only point at one of these. Nothing about the clinic's enrollment or transaction setup is exposed.
