      description: "A prescription, read only and deliberately minimal: the drug, the dose, the frequency, the status and when it was written. Nothing about dispensing, payment, scheduling, the prescriber or notes ever leaves the clinic. There is no way to create or change a prescription through the API. `source` is `eprescribe` for a prescription sent through the clinic's e-prescribing connection and `clinic` otherwise. `status: unknown` appears only on an `eprescribe` prescription whose status the e-prescribing service reports in a form the platform does not recognise."
      required:
        - id
        - patient_id
        - medication
        - status
        - source
      properties:
        id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        medication:
          $ref: "#/components/schemas/PrescriptionMedication"
        dosage:
          type:
            - string
            - "null"
        frequency:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - pending
            - dispensed
            - cancelled
            - out_of_stock
            - unknown
        source:
          type: string
          enum:
            - clinic
            - eprescribe
        prescribed_at:
          type:
            - string
            - "null"
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time
    Submission:
      type: object
      description: "What the clinic's review queue holds for something this key sent: one outside record waiting for, or already past, a clinician's decision."
      required:
