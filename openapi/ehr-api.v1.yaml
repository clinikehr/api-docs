        - patient_id
        - resource_type
        - action
        - review_status
      properties:
        submission_id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        resource_type:
          type: string
          enum:
            - condition
            - allergy
            - medication_statement
            - referral
          description: The kind of record.
        action:
          type: string
          enum:
            - create
            - update
            - retract
        target_id:
          type:
            - string
            - "null"
          format: uuid
          description: The existing record an update or retract is about.
        review_status:
          type: string
          enum:
            - pending
            - confirmed
            - rejected
            - withdrawn
        accepted_automatically:
          type: boolean
          description: True when the clinic has chosen to accept this kind of item from this key or connection without review; the item is then already on the chart and `review_status` is `confirmed`. False for everything a clinician decides, and while it is pending.
        source:
          type: string
          enum:
            - api
        submitted_at:
          type:
            - string
            - "null"
          format: date-time
        decided_at:
          type:
            - string
            - "null"
          format: date-time
        decision_reason:
          type:
            - string
            - "null"
          description: Present only when rejected.
        result_record_id:
          type:
            - string
            - "null"
          format: uuid
          description: The record this became, once confirmed.
        client_reference:
          type:
            - string
            - "null"
        origin_assistant_name:
          type:
            - string
            - "null"
        payload:
          type: object
          description: What was submitted.
    ProviderSpecialty:
      type: object
