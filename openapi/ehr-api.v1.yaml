        is_primary:
          type: boolean
        origin_assistant_name:
          type: string
          maxLength: 200
    CareProviderUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: "A change to an outside care provider your app added. The patient cannot be changed. `is_primary: true` makes the patient's other contacts of the same `type` non-primary."
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
          enum:
            - pcp
            - referring
            - specialist
            - other
        practice_name:
          type: string
          maxLength: 200
        specialty:
          type: string
          maxLength: 100
        npi:
          type: string
          pattern: ^[0-9]{10}$
        phone:
          type: string
          maxLength: 40
        fax:
          type: string
          maxLength: 40
        address:
          type: string
          maxLength: 500
        is_primary:
          type: boolean
    ReferralServiceCode:
      type: object
      description: A coded service. `system` is `snomed-ct` (a SNOMED CT concept id, 6 to 18 digits; the platform holds no SNOMED corpus, so only its shape is checked) or `local` (your own code, never mapped to a standard).
      required:
