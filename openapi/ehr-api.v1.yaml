      description: An outside care provider to add to a patient. Saved straight away. If `is_primary` is true, the patient's other contacts of the same `type` stop being primary. `npi` is ten digits (its shape is checked, not its check digit). The clinic's notes on a contact cannot be sent. The `Idempotency-Key` header is REQUIRED.
