    CoverageUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: "A change to an existing coverage. Changing who the coverage is for (`payer_id`, `member_id`, `group_number`, `subscriber_member_id`, `relationship_to_subscriber` or the policy holder's name or date of birth) on a confirmed coverage sends it back to `unconfirmed` and inactive until staff confirm it again. Other edits keep its status. `coverage_active: false` and `termination_date` end a coverage; `coverage_active: true` is refused with `activation_requires_staff`. Nothing is ever deleted. Send JSON; a FHIR Coverage body is not accepted."
      properties:
