  /v1/clinics/{clinic_id}/patient-imports:
    post:
      operationId: startPatientImport
      tags:
        - Patients
      summary: Import up to 100 patients from a FHIR Bundle, NDJSON, or a JSON array. Nothing is written unless every row is valid.
      description: "The same import the app's Patients screen offers, for the clinic's OWN key. The file is checked in full before anything is written: every row goes through the same validation a real create does. If EVERY row is valid the import runs at once and the response is the finished job (`status: succeeded`). If ANY row fails, nothing is written and the response is the job with `status: needs_review` and a `row_errors` list — row number, field and reason for each, never the value that failed. Fix the file and send it again, or call `runValidPatientImportRows` to import only the rows that passed. A file with exactly the same content that has already been imported is refused `already_imported`, so retrying a timed-out call is safe; no Idempotency-Key is needed or read. An import contacts no patient and starts no automation. A possible duplicate is still created and counted in `flagged_duplicate`, for staff to review. Limits: 100 rows and 10 MiB, refused before any row is read. Needs `patients:write`, the API add-on and the accepted API data agreement. Only a clinic's own key may import — an organization connected to the clinic may not, whatever it was granted (`not_found`)."
      security:
        - ApiKey: []
      parameters:
        - name: clinic_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientImportRequest"
      responses:
        "200":
          description: The finished job — `succeeded`, `needs_review`, or `failed`.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/PatientImportJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    get:
      operationId: listPatientImports
      tags:
        - Patients
      summary: This clinic's import jobs, oldest first.
      description: Job progress and outcome only — never a file, a patient, or a value that failed validation. Needs `patients:write`, like the rest of the import.
      security:
        - ApiKey: []
      parameters:
        - name: clinic_id
