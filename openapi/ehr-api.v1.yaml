        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/clinics/{clinic_id}/inventory/availability:
    post:
      operationId: postInventoryAvailability
      tags:
        - Inventory
      summary: Availability for up to 100 items, by id or by identifier.
      description: For a workspace TEST key this reads the workspace's seeded synthetic sandbox — same shape either way.
      security:
        - ApiKey: []
      parameters:
        - name: clinic_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityRequest"
            example:
              entries:
                - item_id: 9c1e6f2a-9b2b-4a36-8f6a-2f7b1e8b9a02
                - system: gtin
                  value: "6001234567890"
      responses:
        "200":
